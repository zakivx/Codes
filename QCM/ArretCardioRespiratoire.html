          justification: `La décompression active peut favoriser le retour veineux et le remplissage cardiaque entre les compressions.`
        }
      ]
    },

    {
      question: `44. Les états cardiaques suivants donnent lieu à un tableau clinique d’arrêt circulatoire :`,
      choices: [
        {
          label: "A",
          text: `Fibrillation ventriculaire`,
          correct: true,
          justification: `La fibrillation ventriculaire entraîne l'absence de débit cardiaque efficace.`
        },
        {
          label: "B",
          text: `Asystolie`,
          correct: true,
          justification: `L'asystolie constitue un rythme d'arrêt cardiaque non choquable.`
        },
        {
          label: "C",
          text: `Dissociation électromécanique`,
          correct: true,
          justification: `La dissociation électromécanique correspond à une activité électrique sans circulation efficace.`
        },
        {
          label: "D",
          text: `Torsades de pointes`,
          correct: false,
          justification: `Les torsades de pointes ne sont pas nécessairement associées à un arrêt circulatoire.`
        },
        {
          label: "E",
          text: `Tachycardie ventriculaire sans pouls`,
          correct: true,
          justification: `La tachycardie ventriculaire sans pouls est un rythme d'arrêt cardiaque choquable.`
        }
      ]
    },

    {
      question: `Quels sont les signes suffisants et nécessaires pour diagnostiquer un arrêt cardio-respiratoire ?`,
      choices: [
        {
          label: "A",
          text: `Mydriase`,
          correct: false,
          justification: `La mydriase n'est ni nécessaire ni suffisante pour diagnostiquer un arrêt cardio-respiratoire.`
        },
        {
          label: "B",
          text: `Cyanose`,
          correct: false,
          justification: `La cyanose n'est pas un critère nécessaire ou suffisant.`
        },
        {
          label: "C",
          text: `Perte de connaissance`,
          correct: true,
          justification: `La perte de connaissance brutale est un élément majeur de la reconnaissance d'un arrêt cardiaque.`
        },
        {
          label: "D",
          text: `Absence de pouls`,
          correct: true,
          justification: `Chez un professionnel de santé, l'absence de pouls central est un signe important permettant de confirmer l'arrêt cardiaque.`
        },
        {
          label: "E",
          text: `Arrêt respiratoire`,
          correct: true,
          justification: `L'absence de respiration normale, incluant la respiration agonique, fait partie des signes permettant de reconnaître un arrêt cardiaque.`
        }
      ]
    }

    ];

    const container = document.getElementById('quiz-container');

    let currentQuestion = 0;

    /*
     * Stockage des réponses de l'utilisateur.
     * Chaque élément contient les indices des réponses sélectionnées.
     */
    const userAnswers = new Array(questions.length).fill(null);

    /*
     * Indique si la question a déjà été corrigée.
     */
    const validated = new Array(questions.length).fill(false);


    function shuffleArray(array) {

      const arr = array.slice();

      for (let i = arr.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
      }

      return arr;
    }


    function replaceDoubleQuotesWithSingle(str) {

      return String(str).replace(/"/g, "'");

    }


    function decodeHTML(html) {

      const txt = document.createElement("textarea");

      txt.innerHTML = html;

      return replaceDoubleQuotesWithSingle(txt.value);

    }


    function renderQuestion() {

      container.innerHTML = '';

      const q = questions[currentQuestion];

      /*
       * Progression
       */
      const progress = document.createElement('div');

      progress.className = 'progress';

      progress.textContent =
        `Question ${currentQuestion + 1} / ${questions.length}`;

      container.appendChild(progress);


      /*
       * Question
       */
      const questionTitle = document.createElement('div');

      questionTitle.className = 'question-title';

      questionTitle.textContent =
        decodeHTML(q.question);

      container.appendChild(questionTitle);


      /*
       * Formulaire
       */
      const form = document.createElement('form');

      form.id = 'qcm-form';


      /*
       * Randomisation des réponses
       */
      const shuffledChoices = shuffleArray(q.choices);


      shuffledChoices.forEach((choice) => {

        const originalIndex =
          q.choices.indexOf(choice);

        const label =
          document.createElement('label');

        label.className = 'choice';


        const input =
          document.createElement('input');

        input.type = 'checkbox';

        input.name = 'choice';

        input.value = originalIndex;


        /*
         * Restaurer les réponses précédentes
         */
        if (
          userAnswers[currentQuestion] &&
          userAnswers[currentQuestion].includes(originalIndex)
        ) {

          input.checked = true;

        }


        const choiceLabel =
          document.createElement('span');

        choiceLabel.className =
          'choice-label';

        choiceLabel.textContent =
          choice.label + '.';


        label.appendChild(input);

        label.appendChild(choiceLabel);

        label.appendChild(
          document.createTextNode(
            ' ' + decodeHTML(choice.text)
          )
        );


        form.appendChild(label);

      });


      container.appendChild(form);


      /*
       * Si la question a déjà été corrigée,
       * afficher directement la correction.
       */
      if (validated[currentQuestion]) {

        showCorrection(q, form);

      }


      /*
       * Navigation
       */
      const navigation =
        document.createElement('div');

      navigation.className =
        'navigation';


      /*
       * Bouton Previous
       */
      const btnPrevious =
        document.createElement('button');

      btnPrevious.type = 'button';

      btnPrevious.textContent =
        'Previous';

      btnPrevious.disabled =
        currentQuestion === 0;

      btnPrevious.addEventListener(
        'click',
        () => {

          saveCurrentAnswer(form);

          currentQuestion--;

          renderQuestion();

        }
      );


      /*
       * Bouton Valider
       */
      const btnValidate =
        document.createElement('button');

      btnValidate.type = 'button';

      btnValidate.textContent =
        validated[currentQuestion]
          ? 'Validé'
          : 'Valider';

      btnValidate.disabled =
        validated[currentQuestion];

      btnValidate.addEventListener(
        'click',
        () => {

          validateCurrentQuestion(
            q,
            form,
            btnValidate
          );

        }
      );


      /*
       * Bouton Next
       */
      const btnNext =
        document.createElement('button');

      btnNext.type = 'button';

      btnNext.textContent =
        currentQuestion === questions.length - 1
          ? 'Terminer'
          : 'Next';


      btnNext.addEventListener(
        'click',
        () => {

          /*
           * Il faut valider avant de passer
           * à la question suivante.
           */
          if (!validated[currentQuestion]) {

            alert(
              "Veuillez valider cette question avant de continuer."
            );

            return;

          }


          if (
            currentQuestion <
            questions.length - 1
          ) {

            currentQuestion++;

            renderQuestion();

          } else {

            showFinalScore();

          }

        }
      );


      navigation.appendChild(btnPrevious);

      navigation.appendChild(btnValidate);

      navigation.appendChild(btnNext);

      container.appendChild(navigation);

    }


    /*
     * Sauvegarder les réponses cochées
     */
    function saveCurrentAnswer(form) {

      const checked =
        [
          ...form.querySelectorAll(
            'input[type="checkbox"]:checked'
          )
        ];

      userAnswers[currentQuestion] =
        checked.map(
          input => parseInt(input.value)
        );

    }


    /*
     * Valider la question actuelle
     */
    function validateCurrentQuestion(
      q,
      form,
      btnValidate
    ) {

      const checkedBoxes =
        [
          ...form.querySelectorAll(
            'input[type="checkbox"]:checked'
          )
        ];


      if (checkedBoxes.length === 0) {

        alert(
          "Veuillez choisir au moins une réponse."
        );

        return;

      }


      /*
       * Sauvegarder les réponses
       */
      userAnswers[currentQuestion] =
        checkedBoxes.map(
          input => parseInt(input.value)
        );


      /*
       * Marquer comme validée
       */
      validated[currentQuestion] =
        true;


      /*
       * Désactiver les cases
       */
      const checkboxes =
        [
          ...form.querySelectorAll(
            'input[type="checkbox"]'
          )
        ];


      checkboxes.forEach(
        input => {
          input.disabled = true;
        }
      );


      btnValidate.disabled = true;

      btnValidate.textContent =
        'Validé';


      showCorrection(q, form);

    }


    /*
     * Afficher la correction
     */
    function showCorrection(q, form) {

      /*
       * Empêcher la correction d'être
       * ajoutée plusieurs fois.
       */
      if (
        form.querySelector(
          '.correction-container'
        )
      ) {

        return;

      }


      const correctionContainer =
        document.createElement('div');

      correctionContainer.className =
        'correction-container';


      const checkboxes =
        [
          ...form.querySelectorAll(
            'input[type="checkbox"]'
          )
        ];


      checkboxes.forEach(input => {

        const originalIndex =
          parseInt(input.value);

        const choiceData =
          q.choices[originalIndex];

        const label =
          input.parentElement;


        /*
         * Vérification de la réponse
         */
        if (
          input.checked &&
          choiceData.correct
        ) {

          label.classList.add(
            'correct-checked'
          );

        }

        else if (
          input.checked &&
          !choiceData.correct
        ) {

          label.classList.add(
            'incorrect-checked'
          );

        }

        else if (
          !input.checked &&
          choiceData.correct
        ) {

          label.classList.add(
            'missed-correct'
          );

        }


        /*
         * Justification
         */
        const justification =
          document.createElement('div');

        justification.className =
          'justification';


        const symbol =
          choiceData.correct
            ? '✓'
            : '✗';


        justification.textContent =
          `${symbol} : ${decodeHTML(
            choiceData.justification
          )}`;


        label.appendChild(
          justification
        );

      });


      form.appendChild(
        correctionContainer
      );

    }


    /*
     * Calcul du score final
     */
    function calculateFinalScore() {

      let totalPoints = 0;

      let totalPossiblePoints = 0;


      questions.forEach(
        (q, index) => {

          const answers =
            userAnswers[index] || [];


          const correctAnswers =
            q.choices
              .map(
                (choice, i) =>
                  choice.correct
                    ? i
                    : null
              )
              .filter(
                i => i !== null
              );


          /*
           * Chaque bonne réponse sélectionnée
           * rapporte un point.
           */
          answers.forEach(
            answerIndex => {

              if (
                correctAnswers.includes(
                  answerIndex
                )
              ) {

                totalPoints++;

              }

            }
          );


          totalPossiblePoints +=
            correctAnswers.length;

        }
      );


      /*
       * Note sur 5
       */
      const note =
        Math.round(
          (
            totalPoints /
            totalPossiblePoints
          ) * 5 * 100
        ) / 100;


      return {
        totalPoints,
        totalPossiblePoints,
        note
      };

    }


    /*
     * Afficher le score final
     */
    function showFinalScore() {

      const result =
        calculateFinalScore();


      container.innerHTML = '';


      const title =
        document.createElement('div');

      title.className =
        'question-title';

      title.textContent =
        'QCM terminé';

      container.appendChild(title);


      const note =
        document.createElement('div');

      note.className =
        'note';

      note.textContent =
        `Note : ${result.note} / 5`;

      container.appendChild(note);


      const details =
        document.createElement('p');

      details.textContent =
        `Réponses correctes : ${result.totalPoints} / ${result.totalPossiblePoints}`;

      container.appendChild(details);


      /*
       * Bouton pour recommencer
       */
      const restart =
        document.createElement('button');

      restart.type = 'button';

      restart.textContent =
        'Recommencer';


      restart.addEventListener(
        'click',
        () => {

          currentQuestion = 0;

          userAnswers.fill(null);

          validated.fill(false);

          renderQuestion();

        }
      );


      container.appendChild(restart);

    }


    /*
     * Lancement du QCM
     */
    renderQuestion();

  })();
  </script>
