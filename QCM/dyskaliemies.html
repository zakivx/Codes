<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dyskaliémies</title>
  <style>
    #quiz-container {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 1em;
    }

    .question-title {
      font-weight: bold;
      margin-bottom: 0.8em;
    }

    .question-number {
      font-weight: bold;
      margin-bottom: 0.5em;
    }

    .choice {
      margin: 0.4em 0;
      cursor: pointer;
      display: block;
      line-height: 1.5;
    }

    .choice input {
      margin-right: 0.4em;
    }

    .choice-label {
      font-weight: bold;
      margin-right: 0.3em;
    }

    .correct-checked {
      color: green;
      font-weight: bold;
    }

    .incorrect-checked {
      color: red;
      font-weight: bold;
    }

    .missed-correct {
      color: blue;
      font-weight: bold;
    }

    .justification {
      font-size: 0.9em;
      margin: 0.25em 0 0.5em 1.8em;
      color: #555;
      font-weight: normal;
    }

    .note {
      margin-top: 1em;
      font-weight: bold;
      font-size: 1.2em;
    }

    .navigation {
      display: flex;
      gap: 0.5em;
      margin-top: 1em;
      flex-wrap: wrap;
    }

    button {
      padding: 0.5em 1em;
      font-size: 1em;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .progress {
      margin-bottom: 1em;
      font-weight: bold;
    }

    /* Mobile Font Size Adjustment */
    @media (max-width: 768px) {
      #quiz-container {
        font-size: 1rem; /* Base size adjusted to 1rem */
      }

      button {
        font-size: 1em;
        padding: 0.5em 1em;
      }

      .choice input[type="checkbox"] {
        transform: scale(1.1); /* Slightly adjusted checkbox scale for 1rem target */
        margin-right: 0.4em;
      }
    }
  </style>
</head>
<body>
    <header style="background:#007bff; color:#fff; padding:10px; text-align:center;">
  <a href="https://zakivx.github.io/Codes/QCM/qcmList.html" 
      style="color:#fff; text-decoration:none; font-weight:bold;">
    ← Retour à la liste des QCM
  </a>
</header>
  <div id="quiz-container"></div>

  <script>
  (() => {

    const questions = [

{
  question: `2. Une hypokaliémie peut être responsable sur l'électrocardiogramme :`,
  choices: [
    {
      label: "A",
      text: `D'un raccourcissement de l'intervalle QT`,
      correct: false,
      justification: `L'hypokaliémie tend plutôt à prolonger l'intervalle QT (souvent par allongement de l'intervalle QU).`
    },
    {
      label: "B",
      text: `D'ondes T amples, pointues et symétriques`,
      correct: false,
      justification: `Les ondes T amples, pointues et symétriques sont typiques de l'hyperkaliémie.`
    },
    {
      label: "C",
      text: `De l'apparition d'une onde U`,
      correct: true,
      justification: `L'onde U proéminente est un signe classique de l'hypokaliémie, surtout lorsqu'elle est importante.`
    },
    {
      label: "D",
      text: `D'une onde J d'Osborn`,
      correct: false,
      justification: `L'onde J d'Osborn est classiquement associée à l'hypothermie.`
    },
    {
      label: "E",
      text: `D'une ombilication de l'onde T`,
      correct: true,
      justification: `L'hypokaliémie peut entraîner un aplatissement ou une inversion de l'onde T.`
    }
  ]
},

{
  question: `17. Un patient de 40 ans présente des vomissements depuis trois jours, K⁺ = 2,8 mmol/L, Na⁺ = 135 mmol/L et une alcalose métabolique. Quelle est la cause la plus probable du désordre ?`,
  choices: [
    {
      label: "A",
      text: `Pertes rénales`,
      correct: false,
      justification: `Les pertes rénales peuvent provoquer une hypokaliémie et une alcalose, mais le contexte de vomissements prolongés oriente davantage vers une perte digestive haute.`
    },
    {
      label: "B",
      text: `Pertes digestives hautes`,
      correct: true,
      justification: `Les vomissements entraînent une perte d'acide chlorhydrique gastrique, responsable d'une alcalose métabolique, avec hypokaliémie secondaire.`
    },
    {
      label: "C",
      text: `Sécrétion inappropriée d'ADH`,
      correct: false,
      justification: `Le SIADH provoque principalement une hyponatrémie euvolémique et n'explique pas ce tableau d'alcalose métabolique avec hypokaliémie.`
    },
    {
      label: "D",
      text: `Hyperaldostéronisme`,
      correct: false,
      justification: `L'hyperaldostéronisme peut provoquer une hypokaliémie et une alcalose métabolique, mais le contexte clinique rend les vomissements beaucoup plus probables.`
    },
    {
      label: "E",
      text: `Hypomagnésémie`,
      correct: false,
      justification: `L'hypomagnésémie peut favoriser ou rendre difficile la correction d'une hypokaliémie, mais n'est pas la cause principale suggérée ici.`
    }
  ]
},

{
  question: `20. Devant une hyperkaliémie à 6,5 mmol/L avec tachycardie et QRS larges, quels sont les deux médicaments ayant une action rapide ?`,
  choices: [
    {
      label: "A",
      text: `Kayexalate`,
      correct: false,
      justification: `Le polystyrène sulfonate a une action lente et n'est pas adapté au traitement immédiat d'une hyperkaliémie menaçant le pronostic vital.`
    },
    {
      label: "B",
      text: `Lasilix`,
      correct: false,
      justification: `Le furosémide peut favoriser l'élimination rénale du potassium, mais son effet n'est pas suffisamment rapide ni prévisible pour traiter seul une hyperkaliémie avec anomalies ECG.`
    },
    {
      label: "C",
      text: `Gluconate de calcium`,
      correct: true,
      justification: `Le calcium IV agit rapidement sur la membrane myocardique et stabilise le cœur, sans diminuer directement la kaliémie.`
    },
    {
      label: "D",
      text: `Insuline - Glucose`,
      correct: true,
      justification: `L'insuline fait entrer rapidement le potassium dans les cellules ; le glucose est administré pour prévenir l'hypoglycémie.`
    },
    {
      label: "E",
      text: `Bicarbonate de sodium`,
      correct: false,
      justification: `Le bicarbonate peut être utile surtout en présence d'une acidose métabolique significative, mais son efficacité sur la kaliémie est moins fiable et il ne remplace pas le calcium et l'insuline-glucose dans une hyperkaliémie avec anomalies ECG.`
    }
  ]
},

{
  question: `4. Une hypokaliémie peut être responsable sur l'électrocardiogramme de :`,
  choices: [
    {
      label: "A",
      text: `Un raccourcissement de l'intervalle QT`,
      correct: false,
      justification: `L'hypokaliémie tend à prolonger la repolarisation, avec notamment un allongement de l'intervalle QU.`
    },
    {
      label: "B",
      text: `Des ondes T amples, pointues et symétriques`,
      correct: false,
      justification: `Ce sont des signes classiques de l'hyperkaliémie.`
    },
    {
      label: "C",
      text: `L'apparition d'une onde U`,
      correct: true,
      justification: `Une onde U proéminente est un signe électrocardiographique classique de l'hypokaliémie.`
    },
    {
      label: "D",
      text: `Une onde J d'Osborn`,
      correct: false,
      justification: `L'onde J d'Osborn est principalement associée à l'hypothermie.`
    },
    {
      label: "E",
      text: `Un allongement du PR`,
      correct: true,
      justification: `Une hypokaliémie importante peut entraîner des troubles de conduction, notamment un allongement du PR.`
    }
  ]
},

{
  question: `5. Parmi les suivantes, quelle(s) est (sont) la (les) cause(s) possible(s) d'hyperkaliémie ?`,
  choices: [
    {
      label: "A",
      text: `Insuffisance surrénale aiguë`,
      correct: true,
      justification: `Le déficit en aldostérone diminue l'excrétion rénale du potassium et peut provoquer une hyperkaliémie.`
    },
    {
      label: "B",
      text: `Hyperaldostéronisme primaire`,
      correct: false,
      justification: `L'hyperaldostéronisme augmente l'excrétion rénale du potassium et entraîne plutôt une hypokaliémie.`
    },
    {
      label: "C",
      text: `Insuffisance rénale aiguë`,
      correct: true,
      justification: `La diminution de l'excrétion rénale du potassium dans l'insuffisance rénale aiguë peut provoquer une hyperkaliémie.`
    },
    {
      label: "D",
      text: `Vomissements`,
      correct: false,
      justification: `Les vomissements entraînent habituellement une hypokaliémie, notamment par pertes digestives et mécanismes rénaux associés.`
    },
    {
      label: "E",
      text: `Acidose métabolique aiguë`,
      correct: true,
      justification: `Certaines acidoses métaboliques, notamment les acidoses minérales, favorisent la sortie du potassium des cellules et peuvent entraîner une hyperkaliémie.`
    }
  ]
},

{
  question: `6. La prise de spironolactone favorise :`,
  choices: [
    {
      label: "A",
      text: `L'hyperkaliémie`,
      correct: true,
      justification: `La spironolactone est un antagoniste de l'aldostérone et diminue l'excrétion rénale du potassium.`
    },
    {
      label: "B",
      text: `L'hypokaliémie`,
      correct: false,
      justification: `La spironolactone est un diurétique épargneur de potassium et expose plutôt à l'hyperkaliémie.`
    },
    {
      label: "C",
      text: `Une hypoglycémie`,
      correct: false,
      justification: `L'hypoglycémie n'est pas un effet électrolytique caractéristique de la spironolactone.`
    },
    {
      label: "D",
      text: `Une hypocalcémie`,
      correct: false,
      justification: `L'hypocalcémie n'est pas un effet caractéristique de la spironolactone.`
    },
    {
      label: "E",
      text: `Une hypercalcémie`,
      correct: false,
      justification: `L'hypercalcémie n'est pas un effet caractéristique de la spironolactone.`
    }
  ]
},

{
  question: `8. Quel est le signe électrocardiographique parmi les suivants témoignant d'un retentissement cardiaque d'une hyperkaliémie ?`,
  choices: [
    {
      label: "A",
      text: `Onde U`,
      correct: false,
      justification: `L'onde U proéminente est plutôt caractéristique de l'hypokaliémie.`
    },
    {
      label: "B",
      text: `Arythmie complète par fibrillation auriculaire`,
      correct: false,
      justification: `La fibrillation auriculaire n'est pas le signe ECG typique du retentissement cardiaque de l'hyperkaliémie.`
    },
    {
      label: "C",
      text: `Aplatissement de l'onde T`,
      correct: false,
      justification: `L'hyperkaliémie provoque classiquement des ondes T hautes, pointues et symétriques, plutôt qu'un aplatissement de T.`
    },
    {
      label: "D",
      text: `Élargissement du QRS`,
      correct: true,
      justification: `L'élargissement du QRS témoigne d'un retentissement cardiaque important de l'hyperkaliémie et constitue une urgence thérapeutique.`
    },
    {
      label: "E",
      text: `Torsade de pointes`,
      correct: false,
      justification: `La torsade de pointes est surtout associée à un allongement du QT, notamment lors d'une hypokaliémie ou de certains médicaments.`
    }
  ]
},

{
  question: `QCM 27. Les troubles du rythme observés au cours d'une hypokaliémie sévère sont majorés par :`,
  choices: [
    {
      label: "A",
      text: `La prise de diurétiques`,
      correct: true,
      justification: `Les diurétiques, notamment les diurétiques de l'anse et thiazidiques, peuvent aggraver la déplétion potassique et donc le risque rythmique.`
    },
    {
      label: "B",
      text: `L'administration de digitaliques`,
      correct: true,
      justification: `L'hypokaliémie augmente la sensibilité et la toxicité cardiaque des digitaliques, majorant le risque d'arythmies.`
    },
    {
      label: "C",
      text: `Les hypomagnésémies`,
      correct: true,
      justification: `L'hypomagnésémie favorise les troubles du rythme et rend souvent l'hypokaliémie plus difficile à corriger.`
    },
    {
      label: "D",
      text: `Les hypermagnésémies`,
      correct: false,
      justification: `L'hypermagnésémie n'est pas le facteur classique majorant les troubles du rythme liés à l'hypokaliémie.`
    },
    {
      label: "E",
      text: `Les bêtabloquants`,
      correct: false,
      justification: `Les bêtabloquants ne sont pas un facteur classique d'aggravation des troubles du rythme liés à l'hypokaliémie.`
    }
  ]
},

    ];

    const container = document.getElementById('quiz-container');

    let currentQuestion = 0;

    /*
     * Stockage des réponses de l'utilisateur.
     * Chaque élément contient les indices des réponses sélectionnées.
     */
    const userAnswers = new Array(questions.length).fill(null);

    /*
     * Indique si la question a déjà été corrigée.
     */
    const validated = new Array(questions.length).fill(false);


    function shuffleArray(array) {

      const arr = array.slice();

      for (let i = arr.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
      }

      return arr;
    }


    function replaceDoubleQuotesWithSingle(str) {

      return String(str).replace(/"/g, "'");

    }


    function decodeHTML(html) {

      const txt = document.createElement("textarea");

      txt.innerHTML = html;

      return replaceDoubleQuotesWithSingle(txt.value);

    }


    function renderQuestion() {

      container.innerHTML = '';

      const q = questions[currentQuestion];

      /*
       * Progression
       */
      const progress = document.createElement('div');

      progress.className = 'progress';

      progress.textContent =
        `Question ${currentQuestion + 1} / ${questions.length}`;

      container.appendChild(progress);


      /*
       * Question
       */
      const questionTitle = document.createElement('div');

      questionTitle.className = 'question-title';

      questionTitle.textContent =
        decodeHTML(q.question);

      container.appendChild(questionTitle);


      /*
       * Formulaire
       */
      const form = document.createElement('form');

      form.id = 'qcm-form';


      /*
       * Randomisation des réponses
       */
      const shuffledChoices = shuffleArray(q.choices);


      shuffledChoices.forEach((choice) => {

        const originalIndex =
          q.choices.indexOf(choice);

        const label =
          document.createElement('label');

        label.className = 'choice';


        const input =
          document.createElement('input');

        input.type = 'checkbox';

        input.name = 'choice';

        input.value = originalIndex;


        /*
         * Restaurer les réponses précédentes
         */
        if (
          userAnswers[currentQuestion] &&
          userAnswers[currentQuestion].includes(originalIndex)
        ) {

          input.checked = true;

        }


        const choiceLabel =
          document.createElement('span');

        choiceLabel.className =
          'choice-label';

        choiceLabel.textContent =
          choice.label + '.';


        label.appendChild(input);

        label.appendChild(choiceLabel);

        label.appendChild(
          document.createTextNode(
            ' ' + decodeHTML(choice.text)
          )
        );


        form.appendChild(label);

      });


      container.appendChild(form);


      /*
       * Si la question a déjà été corrigée,
       * afficher directement la correction.
       */
      if (validated[currentQuestion]) {

        showCorrection(q, form);

      }


      /*
       * Navigation
       */
      const navigation =
        document.createElement('div');

      navigation.className =
        'navigation';


      /*
       * Bouton Previous
       */
      const btnPrevious =
        document.createElement('button');

      btnPrevious.type = 'button';

      btnPrevious.textContent =
        'Previous';

      btnPrevious.disabled =
        currentQuestion === 0;

      btnPrevious.addEventListener(
        'click',
        () => {

          saveCurrentAnswer(form);

          currentQuestion--;

          renderQuestion();

        }
      );


      /*
       * Bouton Valider
       */
      const btnValidate =
        document.createElement('button');

      btnValidate.type = 'button';

      btnValidate.textContent =
        validated[currentQuestion]
          ? 'Validé'
          : 'Valider';

      btnValidate.disabled =
        validated[currentQuestion];

      btnValidate.addEventListener(
        'click',
        () => {

          validateCurrentQuestion(
            q,
            form,
            btnValidate
          );

        }
      );


      /*
       * Bouton Next
       */
      const btnNext =
        document.createElement('button');

      btnNext.type = 'button';

      btnNext.textContent =
        currentQuestion === questions.length - 1
          ? 'Terminer'
          : 'Next';


      btnNext.addEventListener(
        'click',
        () => {

          /*
           * Il faut valider avant de passer
           * à la question suivante.
           */
          if (!validated[currentQuestion]) {

            alert(
              "Veuillez valider cette question avant de continuer."
            );

            return;

          }


          if (
            currentQuestion <
            questions.length - 1
          ) {

            currentQuestion++;

            renderQuestion();

          } else {

            showFinalScore();

          }

        }
      );


      navigation.appendChild(btnPrevious);

      navigation.appendChild(btnValidate);

      navigation.appendChild(btnNext);

      container.appendChild(navigation);

    }


    /*
     * Sauvegarder les réponses cochées
     */
    function saveCurrentAnswer(form) {

      const checked =
        [
          ...form.querySelectorAll(
            'input[type="checkbox"]:checked'
          )
        ];

      userAnswers[currentQuestion] =
        checked.map(
          input => parseInt(input.value)
        );

    }


    /*
     * Valider la question actuelle
     */
    function validateCurrentQuestion(
      q,
      form,
      btnValidate
    ) {

      const checkedBoxes =
        [
          ...form.querySelectorAll(
            'input[type="checkbox"]:checked'
          )
        ];


      if (checkedBoxes.length === 0) {

        alert(
          "Veuillez choisir au moins une réponse."
        );

        return;

      }


      /*
       * Sauvegarder les réponses
       */
      userAnswers[currentQuestion] =
        checkedBoxes.map(
          input => parseInt(input.value)
        );


      /*
       * Marquer comme validée
       */
      validated[currentQuestion] =
        true;


      /*
       * Désactiver les cases
       */
      const checkboxes =
        [
          ...form.querySelectorAll(
            'input[type="checkbox"]'
          )
        ];


      checkboxes.forEach(
        input => {
          input.disabled = true;
        }
      );


      btnValidate.disabled = true;

      btnValidate.textContent =
        'Validé';


      showCorrection(q, form);

    }


    /*
     * Afficher la correction
     */
    function showCorrection(q, form) {

      /*
       * Empêcher la correction d'être
       * ajoutée plusieurs fois.
       */
      if (
        form.querySelector(
          '.correction-container'
        )
      ) {

        return;

      }


      const correctionContainer =
        document.createElement('div');

      correctionContainer.className =
        'correction-container';


      const checkboxes =
        [
          ...form.querySelectorAll(
            'input[type="checkbox"]'
          )
        ];


      checkboxes.forEach(input => {

        const originalIndex =
          parseInt(input.value);

        const choiceData =
          q.choices[originalIndex];

        const label =
          input.parentElement;


        /*
         * Vérification de la réponse
         */
        if (
          input.checked &&
          choiceData.correct
        ) {

          label.classList.add(
            'correct-checked'
          );

        }

        else if (
          input.checked &&
          !choiceData.correct
        ) {

          label.classList.add(
            'incorrect-checked'
          );

        }

        else if (
          !input.checked &&
          choiceData.correct
        ) {

          label.classList.add(
            'missed-correct'
          );

        }


        /*
         * Justification
         */
        const justification =
          document.createElement('div');

        justification.className =
          'justification';


        const symbol =
          choiceData.correct
            ? '✓'
            : '✗';


        justification.textContent =
          `${symbol} : ${decodeHTML(
            choiceData.justification
          )}`;


        label.appendChild(
          justification
        );

      });


      form.appendChild(
        correctionContainer
      );

    }


    /*
     * Calcul du score final
     */
    function calculateFinalScore() {

      let totalPoints = 0;

      let totalPossiblePoints = 0;


      questions.forEach(
        (q, index) => {

          const answers =
            userAnswers[index] || [];


          const correctAnswers =
            q.choices
              .map(
                (choice, i) =>
                  choice.correct
                    ? i
                    : null
              )
              .filter(
                i => i !== null
              );


          /*
           * Chaque bonne réponse sélectionnée
           * rapporte un point.
           */
          answers.forEach(
            answerIndex => {

              if (
                correctAnswers.includes(
                  answerIndex
                )
              ) {

                totalPoints++;

              }

            }
          );


          totalPossiblePoints +=
            correctAnswers.length;

        }
      );


      /*
       * Note sur 5
       */
      const note =
        Math.round(
          (
            totalPoints /
            totalPossiblePoints
          ) * 5 * 100
        ) / 100;


      return {
        totalPoints,
        totalPossiblePoints,
        note
      };

    }


    /*
     * Afficher le score final
     */
    function showFinalScore() {

      const result =
        calculateFinalScore();


      container.innerHTML = '';


      const title =
        document.createElement('div');

      title.className =
        'question-title';

      title.textContent =
        'QCM terminé';

      container.appendChild(title);


      const note =
        document.createElement('div');

      note.className =
        'note';

      note.textContent =
        `Note : ${result.note} / 5`;

      container.appendChild(note);


      const details =
        document.createElement('p');

      details.textContent =
        `Réponses correctes : ${result.totalPoints} / ${result.totalPossiblePoints}`;

      container.appendChild(details);


      /*
       * Bouton pour recommencer
       */
      const restart =
        document.createElement('button');

      restart.type = 'button';

      restart.textContent =
        'Recommencer';


      restart.addEventListener(
        'click',
        () => {

          currentQuestion = 0;

          userAnswers.fill(null);

          validated.fill(false);

          renderQuestion();

        }
      );


      container.appendChild(restart);

    }


    /*
     * Lancement du QCM
     */
    renderQuestion();

  })();
  </script>

</body>
</html>
