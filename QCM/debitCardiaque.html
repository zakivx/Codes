  <script>
  (() => {

    const questions = [

{
  {
  question: `La pression qui témoigne directement de la précharge du ventricule gauche est :`,
  choices: [
    {
      label: "A",
      text: `Pression protodiastolique ventriculaire gauche`,
      correct: false,
      justification: `Ce n'est pas la pression de référence pour évaluer la précharge du ventricule gauche.`
    },
    {
      label: "B",
      text: `Pression d'éjection systolique ventriculaire gauche`,
      correct: false,
      justification: `Elle reflète principalement la pression développée lors de l'éjection et non la précharge.`
    },
    {
      label: "C",
      text: `Pression moyenne dans l'oreillette gauche`,
      correct: false,
      justification: `Elle peut renseigner indirectement sur les pressions de remplissage, mais la pression télédiastolique ventriculaire gauche est plus directement liée à la précharge du VG.`
    },
    {
      label: "D",
      text: `Pression maximum systolique dans le ventricule gauche`,
      correct: false,
      justification: `Elle ne témoigne pas de la précharge.`
    },
    {
      label: "E",
      text: `Pression télédiastolique dans le ventricule gauche`,
      correct: true,
      justification: `La pression télédiastolique du VG est une estimation de la précharge ventriculaire gauche.`
    }
  ]
},

{
  question: `Les déterminants de la précharge sont :`,
  choices: [
    {
      label: "A",
      text: `Le volume sanguin circulant`,
      correct: true,
      justification: `Une augmentation du volume circulant augmente le retour veineux et le remplissage ventriculaire.`
    },
    {
      label: "B",
      text: `La contractilité`,
      correct: false,
      justification: `La contractilité détermine principalement la performance systolique et non la précharge.`
    },
    {
      label: "C",
      text: `Le tonus veineux`,
      correct: true,
      justification: `La vasoconstriction veineuse mobilise le sang vers le cœur et augmente le retour veineux.`
    },
    {
      label: "D",
      text: `La fréquence cardiaque`,
      correct: false,
      justification: `La fréquence cardiaque n'est pas un déterminant primaire de la précharge.`
    },
    {
      label: "E",
      text: `La fonction diastolique (compliance ventriculaire et relaxation ventriculaire)`,
      correct: true,
      justification: `La compliance et la relaxation ventriculaires influencent le remplissage et donc les pressions télédiastoliques.`
    }
  ]
},

{
  question: `La postcharge est l'ensemble des contraintes qui s'exercent sur la paroi ventriculaire pendant sa contraction. Elle est fonction de :`,
  choices: [
    {
      label: "A",
      text: `La résistance artérielle périphérique`,
      correct: true,
      justification: `Une augmentation des résistances artérielles augmente la charge contre laquelle le ventricule éjecte.`
    },
    {
      label: "B",
      text: `La compliance aortique`,
      correct: true,
      justification: `La compliance artérielle influence la pression développée par le ventricule et donc sa postcharge.`
    },
    {
      label: "C",
      text: `La viscosité sanguine`,
      correct: true,
      justification: `La viscosité influence les résistances à l'écoulement et participe aux contraintes imposées au ventricule.`
    },
    {
      label: "D",
      text: `Le volume de sang contenu dans l'arbre artériel`,
      correct: true,
      justification: `Le volume artériel participe à la pression artérielle et influence la charge contre laquelle le VG éjecte.`
    },
    {
      label: "E",
      text: `La contraction auriculaire`,
      correct: false,
      justification: `La contraction auriculaire influence le remplissage ventriculaire mais ne constitue pas un déterminant direct de la postcharge.`
    }
  ]
},

{
  question: `À l'état physiologique, le retour veineux diminue lors de l'élévation de :`,
  choices: [
    {
      label: "A",
      text: `La pression intrathoracique`,
      correct: true,
      justification: `L'augmentation de la pression intrathoracique augmente la pression auriculaire droite et diminue le gradient de retour veineux.`
    },
    {
      label: "B",
      text: `Le tonus veineux`,
      correct: false,
      justification: `Une augmentation du tonus veineux mobilise le sang veineux vers le cœur et tend à augmenter le retour veineux.`
    },
    {
      label: "C",
      text: `La contraction musculaire`,
      correct: false,
      justification: `La pompe musculaire favorise le retour veineux.`
    },
    {
      label: "D",
      text: `La pression de l'oreillette droite`,
      correct: true,
      justification: `L'augmentation de la pression auriculaire droite réduit le gradient entre la pression systémique moyenne et l'oreillette droite.`
    },
    {
      label: "E",
      text: `La pression intrapéricardique`,
      correct: true,
      justification: `Son augmentation augmente la pression autour du cœur et peut élever la pression auriculaire droite, diminuant ainsi le retour veineux.`
    }
  ]
},

{
  question: `Le débit cardiaque diminue suite à la diminution de :`,
  choices: [
    {
      label: "A",
      text: `Volume télédiastolique`,
      correct: true,
      justification: `Une diminution du volume télédiastolique réduit la précharge et, selon Frank-Starling, le volume d'éjection.`
    },
    {
      label: "B",
      text: `La pression intrathoracique`,
      correct: false,
      justification: `Une diminution de la pression intrathoracique favorise généralement le retour veineux.`
    },
    {
      label: "C",
      text: `La pression intrapéricardique`,
      correct: false,
      justification: `Une diminution de la pression intrapéricardique ne diminue pas directement le débit cardiaque ; elle peut au contraire favoriser le remplissage.`
    },
    {
      label: "D",
      text: `La contractilité myocardique`,
      correct: true,
      justification: `Une diminution de la contractilité réduit la force de contraction et le volume d'éjection.`
    },
    {
      label: "E",
      text: `Des résistances vasculaires lors de l'éjection ventriculaire gauche`,
      correct: false,
      justification: `Une diminution de la postcharge tend à faciliter l'éjection ventriculaire et n'entraîne pas habituellement une diminution du débit cardiaque.`
    }
  ]
},

{
  question: `Le volume télésystolique est le volume sanguin :`,
  choices: [
    {
      label: "A",
      text: `Éjecté à chaque cycle cardiaque`,
      correct: false,
      justification: `Le volume éjecté correspond au volume d'éjection systolique, égal au VTD moins le VTS.`
    },
    {
      label: "B",
      text: `De fin de remplissage`,
      correct: false,
      justification: `Le volume de fin de remplissage est le volume télédiastolique.`
    },
    {
      label: "C",
      text: `De fin de contraction`,
      correct: true,
      justification: `Le volume télésystolique est le volume restant dans le ventricule à la fin de la systole.`
    },
    {
      label: "D",
      text: `De fin d'éjection`,
      correct: true,
      justification: `Le VTS correspond au volume présent dans le ventricule à la fin de l'éjection.`
    },
    {
      label: "E",
      text: `Qui prévient l'accolement de l'endocarde`,
      correct: true,
      justification: `Le maintien d'un volume télésystolique contribue à éviter l'accolement des parois ventriculaires.`
    }
  ]
},

{
  question: `Les barorécepteurs des sinus carotidiens et de la crosse de l'aorte sont :`,
  choices: [
    {
      label: "A",
      text: `Sensibles à la pression pariétale`,
      correct: true,
      justification: `Ils détectent l'étirement de la paroi artérielle, qui dépend notamment de la pression.`
    },
    {
      label: "B",
      text: `Des mécanorécepteurs`,
      correct: true,
      justification: `Les barorécepteurs sont des mécanorécepteurs sensibles à l'étirement de la paroi.`
    },
    {
      label: "C",
      text: `Aussi appelés récepteurs à basse pression`,
      correct: false,
      justification: `Les sinus carotidiens et la crosse aortique contiennent des récepteurs à haute pression.`
    },
    {
      label: "D",
      text: `Adressent par l'intermittence des influx nerveux modérateurs ou dépresseurs vers les centres`,
      correct: true,
      justification: `Leur fréquence de décharge varie avec la pression artérielle et participe au contrôle réflexe cardiovasculaire.`
    },
    {
      label: "E",
      text: `Mis en jeu dans les situations d'urgence de chute de pression artérielle`,
      correct: true,
      justification: `Le baroréflexe participe rapidement à la compensation d'une baisse aiguë de pression artérielle.`
    }
  ]
},

{
  question: `La contraction isovolumique ventriculaire est à l'origine :`,
  choices: [
    {
      label: "A",
      text: `D'une diminution de la pression intra-auriculaire`,
      correct: false,
      justification: `La contraction ventriculaire augmente surtout la pression intraventriculaire.`
    },
    {
      label: "B",
      text: `D'une augmentation de la pression intraventriculaire`,
      correct: true,
      justification: `Pendant la contraction isovolumique, le volume reste constant tandis que la pression ventriculaire augmente rapidement.`
    },
    {
      label: "C",
      text: `De la fermeture de la valve aortique`,
      correct: false,
      justification: `La valve aortique se ferme à la fin de l'éjection, lors du début de la relaxation isovolumique.`
    },
    {
      label: "D",
      text: `De l'augmentation du temps d'éjection`,
      correct: false,
      justification: `La contraction isovolumique précède l'éjection ; elle ne constitue pas la phase d'éjection.`
    },
    {
      label: "E",
      text: `D'une consommation myocardique accrue d'énergie`,
      correct: true,
      justification: `La contraction ventriculaire nécessite une consommation d'ATP, même pendant la phase isovolumique.`
    }
  ]
},

{
  question: `L'effet inotrope positif (+) est ajusté par :`,
  choices: [
    {
      label: "A",
      text: `Le système nerveux autonome parasympathique`,
      correct: false,
      justification: `Le parasympathique exerce surtout un effet chronotrope et dromotrope négatif ; son effet inotrope ventriculaire est faible.`
    },
    {
      label: "B",
      text: `Les catécholamines`,
      correct: true,
      justification: `Les catécholamines stimulent les récepteurs bêta-1 cardiaques et augmentent la contractilité.`
    },
    {
      label: "C",
      text: `La concentration du Ca2+`,
      correct: true,
      justification: `Le calcium intracellulaire joue un rôle central dans le couplage excitation-contraction et la force de contraction.`
    },
    {
      label: "D",
      text: `Le retour veineux`,
      correct: false,
      justification: `Le retour veineux détermine principalement la précharge et non directement l'inotropisme.`
    },
    {
      label: "E",
      text: `La postcharge`,
      correct: false,
      justification: `La postcharge influence l'éjection ventriculaire mais ne constitue pas un mécanisme d'inotropisme positif.`
    }
  ]
},

{
  question: `La pression pulsée :`,
  choices: [
    {
      label: "A",
      text: `C'est la pression artérielle moyenne`,
      correct: false,
      justification: `La pression pulsée correspond à la différence entre la pression systolique et la pression diastolique.`
    },
    {
      label: "B",
      text: `C'est la différence entre la pression systolique et la pression artérielle moyenne`,
      correct: false,
      justification: `La pression pulsée est PAS − PAD, et non PAS − PAM.`
    },
    {
      label: "C",
      text: `Dépend du volume télédiastolique`,
      correct: true,
      justification: `Le volume d'éjection, lui-même influencé par le volume télédiastolique, participe à la détermination de la pression pulsée.`
    },
    {
      label: "D",
      text: `Dépend de la compliance des artères`,
      correct: true,
      justification: `À volume d'éjection donné, une faible compliance artérielle entraîne une pression pulsée plus élevée.`
    },
    {
      label: "E",
      text: `Toutes les réponses sont fausses`,
      correct: false,
      justification: `Les propositions C et D sont correctes.`
    }
  ]
},

{
  question: `Le retour veineux dépend de :`,
  choices: [
    {
      label: "A",
      text: `La pression veineuse centrale`,
      correct: true,
      justification: `La pression auriculaire droite, souvent approchée par la pression veineuse centrale, influence le gradient de retour veineux.`
    },
    {
      label: "B",
      text: `La pression veineuse motrice`,
      correct: true,
      justification: `Le retour veineux dépend d'un gradient de pression entre le compartiment systémique et l'oreillette droite.`
    },
    {
      label: "C",
      text: `La gravité`,
      correct: true,
      justification: `La gravité modifie les pressions hydrostatiques et influence le retour veineux, notamment en position debout.`
    },
    {
      label: "D",
      text: `Les battements artériels`,
      correct: false,
      justification: `Les battements artériels peuvent contribuer à la propulsion veineuse localement, mais ne constituent pas un déterminant fondamental du retour veineux dans ce modèle.`
    },
    {
      label: "E",
      text: `Toutes les réponses sont fausses`,
      correct: false,
      justification: `Plusieurs propositions sont correctes.`
    }
  ]
},

{
  question: `La loi de Frank-Starling peut être résumée comme étant :`,
  choices: [
    {
      label: "A",
      text: `La longueur de fibre myocardique est proportionnelle au volume ventriculaire en fin de systole`,
      correct: false,
      justification: `La relation concerne principalement la longueur initiale des fibres, liée au remplissage ventriculaire, et la force de contraction.`
    },
    {
      label: "B",
      text: `La longueur de la fibre est indépendante de la tension qu'elle exerce`,
      correct: false,
      justification: `La longueur initiale des fibres influence la force développée par le myocarde.`
    },
    {
      label: "C",
      text: `La longueur de la fibre ne joue aucun rôle dans l'énergie de contraction cardiaque`,
      correct: false,
      justification: `La longueur initiale des fibres influence la force et le volume d'éjection dans les limites physiologiques.`
    },
    {
      label: "D",
      text: `L'énergie de contraction est proportionnelle à la longueur initiale de la fibre myocardique`,
      correct: true,
      justification: `Dans les limites physiologiques, l'augmentation de la longueur initiale des fibres myocardiques augmente la force de contraction et le volume d'éjection.`
    },
    {
      label: "E",
      text: `Toutes les réponses sont fausses`,
      correct: false,
      justification: `La proposition D correspond au principe de Frank-Starling.`
    }
  ]
},

{
  question: `Le système rénine-angiotensine intervient dans la régulation de la pression artérielle :`,
  choices: [
    {
      label: "A",
      text: `À court terme`,
      correct: false,
      justification: `Le système rénine-angiotensine-aldostérone intervient surtout dans la régulation à moyen et long terme plutôt que dans la réponse réflexe immédiate.`
    },
    {
      label: "B",
      text: `À moyen terme`,
      correct: true,
      justification: `L'angiotensine II et l'aldostérone participent à la régulation de la pression artérielle sur le moyen et long terme.`
    },
    {
      label: "C",
      text: `En provoquant une vasodilatation artérielle`,
      correct: false,
      justification: `L'angiotensine II provoque principalement une vasoconstriction artérielle.`
    },
    {
      label: "D",
      text: `En stimulant les barorécepteurs`,
      correct: false,
      justification: `Le système rénine-angiotensine n'agit pas principalement en stimulant les barorécepteurs.`
    },
    {
      label: "E",
      text: `En stimulant les chémorécepteurs`,
      correct: false,
      justification: `Les chémorécepteurs interviennent surtout dans la régulation ventilatoire et cardiovasculaire en réponse aux variations de gaz et de pH.`
    }
  ]
},

{
  question: `La précharge peut être déterminée par :`,
  choices: [
    {
      label: "A",
      text: `La pression télédiastolique`,
      correct: true,
      justification: `La pression télédiastolique ventriculaire est une estimation de la précharge.`
    },
    {
      label: "B",
      text: `Les résistances vasculaires`,
      correct: false,
      justification: `Les résistances vasculaires déterminent principalement la postcharge et non la précharge.`
    },
    {
      label: "C",
      text: `La pression veineuse`,
      correct: true,
      justification: `Les pressions veineuses participent à l'évaluation du remplissage ventriculaire, de façon indirecte.`
    },
    {
      label: "D",
      text: `Le degré d'étirement de la fibre myocardique avant sa contraction`,
      correct: true,
      justification: `La précharge correspond physiologiquement à l'étirement initial des fibres myocardiques avant la contraction.`
    },
    {
      label: "E",
      text: `Le volume télédiastolique`,
      correct: true,
      justification: `Le volume télédiastolique est une mesure volumétrique classique de la précharge ventriculaire.`
    }
  ]
},

{
  question: `La pression artérielle systolique d'un patient ayant une PAM à 120 mmHg et une PAD à 100 mmHg est :`,
  choices: [
    {
      label: "A",
      text: `160 mmHg`,
      correct: true,
      justification: `Avec PAM ≈ PAD + 1/3(PAS − PAD), on obtient 120 = 100 + (PAS − 100)/3, donc PAS = 160 mmHg.`
    },
    {
      label: "B",
      text: `120 mmHg`,
      correct: false,
      justification: `120 mmHg correspond ici à la PAM, pas à la PAS.`
    },
    {
      label: "C",
      text: `90 mmHg`,
      correct: false,
      justification: `Cette valeur est inférieure à la PAD et est donc impossible dans ce contexte.`
    },
    {
      label: "D",
      text: `110 mmHg`,
      correct: false,
      justification: `La PAS doit être supérieure à la PAD ; avec la formule approchée, elle est de 160 mmHg.`
    },
    {
      label: "E",
      text: `190 mmHg`,
      correct: false,
      justification: `Cette valeur ne correspond pas au calcul à partir de la PAM et de la PAD données.`
    }
  ]
},

{
  question: `L'augmentation de la compliance ventriculaire se traduit sur une courbe pression-volume par :`,
  choices: [
    {
      label: "A",
      text: `Un déplacement vers le haut du point télésystolique`,
      correct: false,
      justification: `L'augmentation de compliance concerne principalement la relation pression-volume diastolique.`
    },
    {
      label: "B",
      text: `Un déplacement vers le bas du point télésystolique`,
      correct: false,
      justification: `Ce n'est pas la conséquence directe de l'augmentation de la compliance diastolique.`
    },
    {
      label: "C",
      text: `Un déplacement vers le haut du point télédiastolique`,
      correct: false,
      justification: `À volume donné, une meilleure compliance entraîne une pression télédiastolique plus faible.`
    },
    {
      label: "D",
      text: `Un déplacement vers le bas du point télédiastolique`,
      correct: true,
      justification: `À volume télédiastolique identique, une augmentation de la compliance diminue la pression télédiastolique.`

    {
      label: "E",
      text: `Un déplacement vers le bas et à gauche du point télésystolique`,
      correct: false,
      justification: `La compliance diastolique n'entraîne pas directement ce déplacement du point télésystolique.`
    }
  ]
},

{
  question: `La circulation veineuse :`,
  choices: [
    {
      label: "A",
      text: `La pression veineuse est élevée`,
      correct: false,
      justification: `Le système veineux est un système à basse pression.`
    },
    {
      label: "B",
      text: `La pression veineuse est pulsatile et de type dynamique`,
      correct: false,
      justification: `La pression veineuse est faible et beaucoup moins pulsatile que la pression artérielle.`
    },
    {
      label: "C",
      text: `Les résistances veineuses sont basses`,
      correct: true,
      justification: `Le système veineux est un compartiment à faible résistance et à forte capacitance.`
    },
    {
      label: "D",
      text: `La distensibilité du secteur veineux est faible`,
      correct: false,
      justification: `Les veines sont très distensibles et peuvent contenir une grande partie du volume sanguin.`
    },
    {
      label: "E",
      text: `La vitesse de la circulation veineuse augmente quand on se rapproche du cœur`,
      correct: true,
      justification: `La section transversale totale diminue en se rapprochant du cœur, ce qui contribue à augmenter la vitesse moyenne du sang.`
    }
  ]
},

{
  question: `Le système artériel est caractérisé par :`,
  choices: [
    {
      label: "A",

{

  choices: [

    ];

    const container = document.getElementById('quiz-container');

    let currentQuestion = 0;

    /*
     * Stockage des réponses de l'utilisateur.
     * Chaque élément contient les indices des réponses sélectionnées.
     */
    const userAnswers = new Array(questions.length).fill(null);

    /*
     * Indique si la question a déjà été corrigée.
     */
    const validated = new Array(questions.length).fill(false);


    function shuffleArray(array) {

      const arr = array.slice();

      for (let i = arr.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
      }

      return arr;
    }


    function replaceDoubleQuotesWithSingle(str) {

      return String(str).replace(/"/g, "'");

    }


    function decodeHTML(html) {

      const txt = document.createElement("textarea");

      txt.innerHTML = html;

      return replaceDoubleQuotesWithSingle(txt.value);

    }


    function renderQuestion() {

      container.innerHTML = '';

      const q = questions[currentQuestion];

      /*
       * Progression
       */
      const progress = document.createElement('div');

      progress.className = 'progress';

      progress.textContent =
        `Question ${currentQuestion + 1} / ${questions.length}`;

      container.appendChild(progress);


      /*
       * Question
       */
      const questionTitle = document.createElement('div');

      questionTitle.className = 'question-title';

      questionTitle.textContent =
        decodeHTML(q.question);

      container.appendChild(questionTitle);


      /*
       * Formulaire
       */
      const form = document.createElement('form');

      form.id = 'qcm-form';


      /*
       * Randomisation des réponses
       */
      const shuffledChoices = shuffleArray(q.choices);


      shuffledChoices.forEach((choice) => {

        const originalIndex =
          q.choices.indexOf(choice);

        const label =
          document.createElement('label');

        label.className = 'choice';


        const input =
          document.createElement('input');

        input.type = 'checkbox';

        input.name = 'choice';

        input.value = originalIndex;


        /*
         * Restaurer les réponses précédentes
         */
        if (
          userAnswers[currentQuestion] &&
          userAnswers[currentQuestion].includes(originalIndex)
        ) {

          input.checked = true;

        }


        const choiceLabel =
          document.createElement('span');

        choiceLabel.className =
          'choice-label';

        choiceLabel.textContent =
          choice.label + '.';


        label.appendChild(input);

        label.appendChild(choiceLabel);

        label.appendChild(
          document.createTextNode(
            ' ' + decodeHTML(choice.text)
          )
        );


        form.appendChild(label);

      });


      container.appendChild(form);


      /*
       * Si la question a déjà été corrigée,
       * afficher directement la correction.
       */
      if (validated[currentQuestion]) {

        showCorrection(q, form);

      }


      /*
       * Navigation
       */
      const navigation =
        document.createElement('div');

      navigation.className =
        'navigation';


      /*
       * Bouton Previous
       */
      const btnPrevious =
        document.createElement('button');

      btnPrevious.type = 'button';

      btnPrevious.textContent =
        'Previous';

      btnPrevious.disabled =
        currentQuestion === 0;

      btnPrevious.addEventListener(
        'click',
        () => {

          saveCurrentAnswer(form);

          currentQuestion--;

          renderQuestion();

        }
      );


      /*
       * Bouton Valider
       */
      const btnValidate =
        document.createElement('button');

      btnValidate.type = 'button';

      btnValidate.textContent =
        validated[currentQuestion]
          ? 'Validé'
          : 'Valider';

      btnValidate.disabled =
        validated[currentQuestion];

      btnValidate.addEventListener(
        'click',
        () => {

          validateCurrentQuestion(
            q,
            form,
            btnValidate
          );

        }
      );


      /*
       * Bouton Next
       */
      const btnNext =
        document.createElement('button');

      btnNext.type = 'button';

      btnNext.textContent =
        currentQuestion === questions.length - 1
          ? 'Terminer'
          : 'Next';


      btnNext.addEventListener(
        'click',
        () => {

          /*
           * Il faut valider avant de passer
           * à la question suivante.
           */
          if (!validated[currentQuestion]) {

            alert(
              "Veuillez valider cette question avant de continuer."
            );

            return;

          }


          if (
            currentQuestion <
            questions.length - 1
          ) {

            currentQuestion++;

            renderQuestion();

          } else {

            showFinalScore();

          }

        }
      );


      navigation.appendChild(btnPrevious);

      navigation.appendChild(btnValidate);

      navigation.appendChild(btnNext);

      container.appendChild(navigation);

    }


    /*
     * Sauvegarder les réponses cochées
     */
    function saveCurrentAnswer(form) {

      const checked =
        [
          ...form.querySelectorAll(
            'input[type="checkbox"]:checked'
          )
        ];

      userAnswers[currentQuestion] =
        checked.map(
          input => parseInt(input.value)
        );

    }


    /*
     * Valider la question actuelle
     */
    function validateCurrentQuestion(
      q,
      form,
      btnValidate
    ) {

      const checkedBoxes =
        [
          ...form.querySelectorAll(
            'input[type="checkbox"]:checked'
          )
        ];


      if (checkedBoxes.length === 0) {

        alert(
          "Veuillez choisir au moins une réponse."
        );

        return;

      }


      /*
       * Sauvegarder les réponses
       */
      userAnswers[currentQuestion] =
        checkedBoxes.map(
          input => parseInt(input.value)
        );


      /*
       * Marquer comme validée
       */
      validated[currentQuestion] =
        true;


      /*
       * Désactiver les cases
       */
      const checkboxes =
        [
          ...form.querySelectorAll(
            'input[type="checkbox"]'
          )
        ];


      checkboxes.forEach(
        input => {
          input.disabled = true;
        }
      );


      btnValidate.disabled = true;

      btnValidate.textContent =
        'Validé';


      showCorrection(q, form);

    }


    /*
     * Afficher la correction
     */
    function showCorrection(q, form) {

      /*
       * Empêcher la correction d'être
       * ajoutée plusieurs fois.
       */
      if (
        form.querySelector(
          '.correction-container'
        )
      ) {

        return;

      }


      const correctionContainer =
        document.createElement('div');

      correctionContainer.className =
        'correction-container';


      const checkboxes =
        [
          ...form.querySelectorAll(
            'input[type="checkbox"]'
          )
        ];


      checkboxes.forEach(input => {

        const originalIndex =
          parseInt(input.value);

        const choiceData =
          q.choices[originalIndex];

        const label =
          input.parentElement;


        /*
         * Vérification de la réponse
         */
        if (
          input.checked &&
          choiceData.correct
        ) {

          label.classList.add(
            'correct-checked'
          );

        }

        else if (
          input.checked &&
          !choiceData.correct
        ) {

          label.classList.add(
            'incorrect-checked'
          );

        }

        else if (
          !input.checked &&
          choiceData.correct
        ) {

          label.classList.add(
            'missed-correct'
          );

        }


        /*
         * Justification
         */
        const justification =
          document.createElement('div');

        justification.className =
          'justification';


        const symbol =
          choiceData.correct
            ? '✓'
            : '✗';


        justification.textContent =
          `${symbol} : ${decodeHTML(
            choiceData.justification
          )}`;


        label.appendChild(
          justification
        );

      });


      form.appendChild(
        correctionContainer
      );

    }


    /*
     * Calcul du score final
     */
    function calculateFinalScore() {

      let totalPoints = 0;

      let totalPossiblePoints = 0;


      questions.forEach(
        (q, index) => {

          const answers =
            userAnswers[index] || [];


          const correctAnswers =
            q.choices
              .map(
                (choice, i) =>
                  choice.correct
                    ? i
                    : null
              )
              .filter(
                i => i !== null
              );


          /*
           * Chaque bonne réponse sélectionnée
           * rapporte un point.
           */
          answers.forEach(
            answerIndex => {

              if (
                correctAnswers.includes(
                  answerIndex
                )
              ) {

                totalPoints++;

              }

            }
          );


          totalPossiblePoints +=
            correctAnswers.length;

        }
      );


      /*
       * Note sur 5
       */
      const note =
        Math.round(
          (
            totalPoints /
            totalPossiblePoints
          ) * 5 * 100
        ) / 100;


      return {
        totalPoints,
        totalPossiblePoints,
        note
      };

    }


    /*
     * Afficher le score final
     */
    function showFinalScore() {

      const result =
        calculateFinalScore();


      container.innerHTML = '';


      const title =
        document.createElement('div');

      title.className =
        'question-title';

      title.textContent =
        'QCM terminé';

      container.appendChild(title);


      const note =
        document.createElement('div');

      note.className =
        'note';

      note.textContent =
        `Note : ${result.note} / 5`;

      container.appendChild(note);


      const details =
        document.createElement('p');

      details.textContent =
        `Réponses correctes : ${result.totalPoints} / ${result.totalPossiblePoints}`;

      container.appendChild(details);


      /*
       * Bouton pour recommencer
       */
      const restart =
        document.createElement('button');

      restart.type = 'button';

      restart.textContent =
        'Recommencer';


      restart.addEventListener(
        'click',
        () => {

          currentQuestion = 0;

          userAnswers.fill(null);

          validated.fill(false);

          renderQuestion();

        }
      );


      container.appendChild(restart);

    }


    /*
     * Lancement du QCM
     */
    renderQuestion();

  })();
  </script>
